<!DOCTYPE html>
<html>
<head>
  <title>Answers</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      line-height: 1.6;
    }

    img {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<h2 id="title"></h2>

<img src="https://i.ibb.co/wrRvFsyw/IMG-20260601-131537-837.jpg" width="100%">

<img id="image" style="display:block; width:100%; border:2px solid red;">
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzSw3J9ijVn-1xwGkKh8ZXe77i44QsVmE",
  authDomain: "mikeanswers-1ba00.firebaseapp.com",
  projectId: "mikeanswers-1ba00"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Get URL parameters
const urlParams = new URLSearchParams(window.location.search);
const subject = urlParams.get("subject");
const pin = urlParams.get("pin");

// Show subject title
document.getElementById("title").innerText = subject;

// Get document from Firestore
const docRef = doc(db, "answers", subject);
const docSnap = await getDoc(docRef);

if (docSnap.exists()) {

  const data = docSnap.data();

  if (data.pin == pin) {

    // Display content
    document.getElementById("content").innerHTML = data.content || "";

    // Display image if available
    if (data.image && data.image.trim() !== "") {

      const img = document.getElementById("image");
img.src = data.image;
      img.src = data.image;
      img.style.display = "block";

      img.onerror = function () {
        console.log("Image failed to load");
      };
    }

  } else {
    alert("Wrong PIN");
  }

} else {
  alert("Subject not found");
}

</script>

</body>
</html>
